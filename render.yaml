services:
  - type: web
    name: quiz-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn quiz_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yourdomain.com"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        fromService:
          type: postgres
          name: quiz-db
          property: database
      - key: DB_USER
        fromService:
          type: postgres
          name: quiz-db
          property: username
      - key: DB_PASSWORD
        fromService:
          type: postgres
          name: quiz-db
          property: password
      - key: DB_HOST
        fromService:
          type: postgres
          name: quiz-db
          property: host
      - key: DB_PORT
        fromService:
          type: postgres
          name: quiz-db
          property: port
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: postgres
    name: quiz-db
    plan: free
    ipAllowList: []
    preDeployCommand: echo "Database ready"
