services:
  - type: web
    name: quiz-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn quiz_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://yourdomain.com"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        fromDatabase:
          name: quiz-db
          property: databaseName
      - key: DB_USER
        fromDatabase:
          name: quiz-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quiz-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: quiz-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quiz-db
          property: port
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: quiz-db
    plan: free
    databaseName: quiz_db
    user: quiz_db
    ipAllowList: []
